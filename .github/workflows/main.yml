name: Build Wii U WUHB

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Ya no sincronizamos bases de datos, eso es lo que da 403
      - name: Build .wuhb
        run: |
          set -e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPPC/bin:$PATH
          # Si necesitas SDL, descomenta la siguiente linea, pero sin -Sy
          # dkp-pacman -S --noconfirm --needed wiiu-sdl2 wiiu-sdl2_image wiiu-sdl2_mixer wiiu-sdl2_ttf || true
          ls -la
          test -f Makefile || { echo "ERROR: no hay Makefile"; exit 1; }
          make clean || true
          make -j$(nproc)
          find . -name "*.wuhb"

      - name: Upload WUHB
        uses: actions/upload-artifact@v4
        with:
          name: CapibaraRoyale-WiiU
          path: "**/*.wuhb"
          if-no-files-found: error
