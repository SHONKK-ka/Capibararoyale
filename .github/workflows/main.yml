name: Build Wii U WUHB

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Wii U libs
        run: |
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S --noconfirm wiiu-dev wiiu-sdl2 wiiu-sdl2_image wiiu-sdl2_mixer wiiu-sdl2_ttf

      - name: Build .wuhb
        run: |
          set -e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPPC/bin:$PATH
          ls -la
          test -f Makefile || { echo "ERROR: no hay Makefile en la raíz"; exit 1; }
          make clean || true
          make -j$(nproc)
          echo "=== Archivos .wuhb generados ==="
          find . -name "*.wuhb"
          test -n "$(find . -name '*.wuhb')" || { echo "ERROR: make no generó ningún .wuhb"; exit 1; }

      - name: Upload WUHB
        uses: actions/upload-artifact@v4
        with:
          name: CapibaraRoyale-WiiU
          path: "**/*.wuhb"
          if-no-files-found: error
